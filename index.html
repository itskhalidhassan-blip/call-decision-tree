<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://images.pexels.com" />
    <title>HALDER</title>
    <style>
      :root {
        color-scheme: dark;
        --black: #000;
        --near-black: #050505;
        --white: #f2f1ed;
        --quiet: #aaa9a4;
        --rule: #242424;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--black);
      }

      body {
        margin: 0;
        background: var(--black);
        color: var(--white);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
      }

      .hero {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
        background: var(--black);
      }

      .hero-media {
        position: absolute;
        z-index: -1;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 54%;
        filter: brightness(0.56) saturate(0.72) contrast(1.04);
        pointer-events: none;
        user-select: none;
      }

      .name,
      .hero-title,
      .hero .text-link {
        opacity: 0;
        animation: appear 900ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .name {
        position: absolute;
        top: clamp(1.5rem, 3vw, 2.75rem);
        left: clamp(1.25rem, 4vw, 4.5rem);
        margin: 0;
        font-size: 0.69rem;
        font-weight: 500;
        letter-spacing: 0.065em;
        line-height: 1;
        animation-delay: 80ms;
      }

      .hero-title {
        position: absolute;
        top: 66%;
        left: clamp(1.25rem, 4vw, 4.5rem);
        margin: 0;
        max-width: calc(100vw - 2.5rem);
        font-size: clamp(0.84rem, 4.25vw, 3.45rem);
        font-weight: 300;
        letter-spacing: -0.032em;
        line-height: 1;
        white-space: nowrap;
        animation-delay: 230ms;
      }

      .text-link {
        display: inline-block;
        width: max-content;
        padding: 0.35rem 0;
        border-bottom: 1px solid currentColor;
        font-size: 0.78rem;
        font-weight: 400;
        line-height: 1;
        text-decoration: none;
        transition: color 180ms ease, border-color 180ms ease;
      }

      .hero .text-link {
        position: absolute;
        right: clamp(1.25rem, 4vw, 4.5rem);
        bottom: clamp(1.75rem, 4vw, 3.5rem);
        animation-delay: 400ms;
      }

      .text-link:hover {
        color: var(--quiet);
        border-color: var(--quiet);
      }

      .text-link:focus-visible,
      .call-link:focus-visible {
        outline: 1px solid var(--white);
        outline-offset: 0.45rem;
      }

      .work {
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(2rem, 5vw, 5rem) clamp(1.25rem, 4vw, 4.5rem);
        background: var(--near-black);
        display: flex;
        flex-direction: column;
      }

      .statement {
        width: min(100%, 56rem);
        margin: clamp(2.5rem, 8vh, 6.5rem) 0 0;
        font-size: clamp(1.9rem, 4.1vw, 3.9rem);
        font-weight: 300;
        letter-spacing: -0.045em;
        line-height: 1.08;
      }

      .proof {
        width: min(100%, 30rem);
        margin: clamp(5.5rem, 17vh, 11rem) 0 0 auto;
        padding: 0;
        color: var(--quiet);
        list-style: none;
        font-size: clamp(0.94rem, 1.2vw, 1.08rem);
        line-height: 1.5;
      }

      .proof li + li {
        margin-top: 0.55rem;
      }

      .conversion {
        margin-top: auto;
        padding-top: 1.1rem;
        border-top: 1px solid var(--rule);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 2rem;
      }

      .call-link {
        font-size: clamp(0.9rem, 1.2vw, 1.05rem);
        font-weight: 300;
        line-height: 1.2;
        text-decoration: none;
        transition: color 180ms ease;
      }

      .call-link:hover {
        color: var(--quiet);
      }

      @keyframes appear {
        to {
          opacity: 1;
        }
      }

      @media (max-width: 35rem) {
        .hero-title {
          top: 68%;
        }

        .proof {
          margin-left: 0;
        }

        .conversion {
          align-items: flex-start;
          flex-direction: column;
          gap: 1.4rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .name,
        .hero-title,
        .hero .text-link {
          opacity: 1;
          animation: none;
        }

        .text-link,
        .call-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body id="top">
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <img
          class="hero-media"
          src="https://images.pexels.com/photos/34610816/pexels-photo-34610816.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=2400"
          alt=""
          fetchpriority="high"
          decoding="async"
        />
        <p class="name">HALDER</p>
        <h1 class="hero-title" id="hero-title">
          THE SITE SHOULD FEEL LIKE A PLACE
        </h1>
        <a class="text-link" href="#work">See the work</a>
      </section>

      <section class="work" id="work" aria-label="About HALDER">
        <p class="statement">
          We make sites that qualify the room before they ask for the job.
        </p>

        <ul class="proof">
          <li>Built for people who already know.</li>
          <li>Quiet first. Then the number.</li>
          <li>Local work. Private pieces.</li>
        </ul>

        <div class="conversion">
          <a class="call-link" href="tel:+15555550100">
            Call +1 555 555 0100
          </a>
          <a class="text-link" href="#work">See the work</a>
        </div>
      </section>
    </main>
  </body>
</html>
